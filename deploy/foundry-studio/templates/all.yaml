apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: foundry-studio-workspace}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: {requests: {storage: {{ .Values.storage }}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: foundry-studio, labels: {app: foundry-studio}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: foundry-studio}}
  template:
    metadata: {labels: {app: foundry-studio}}
    spec:
      securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
      initContainers:
        - name: chown
          image: busybox:1.37
          securityContext: {runAsUser: 0}
          command: [sh, -c, "chown 1000:1000 /ws"]
          volumeMounts: [{name: workspace, mountPath: /ws}]
      containers:
        - name: studio
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [uvicorn, foundry_studio.app:app, --host, 0.0.0.0, --port, "8000"]
          envFrom: [{secretRef: {name: {{ .Values.envSecret }}}}]
          ports: [{containerPort: 8000}]
          readinessProbe: {httpGet: {path: /, port: 8000}, periodSeconds: 10}
          volumeMounts:
            - {name: workspace, mountPath: /opt/foundry-studio/workspace}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 1Gi}}
      volumes:
        - name: workspace
          persistentVolumeClaim: {claimName: foundry-studio-workspace}
---
apiVersion: v1
kind: Service
metadata: {name: foundry-studio}
spec:
  type: NodePort
  selector: {app: foundry-studio}
  ports: [{name: http, port: 8000, targetPort: 8000, nodePort: {{ .Values.nodePort }}}]
